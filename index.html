<!DOCTYPE html>
<html lang="ur" dir="rtl" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="google" content="notranslate">
<meta name="robots" content="notranslate">
<title>امۃ اللہ ⚓ ملا طٰہٰ | دعوتِ نکاح</title>
<style>
  :root{ --navy:#10102c; --royal:#1c4d92; --navy-2:#0b1b3e; --gold:#c8a24c; --gold-light:#e9d49b; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; background:var(--navy); }
  body{ overflow-x:hidden; }

  /* ================================================================
     OPENING SCREEN (new — simple, shown before the existing intro
     video). --stage-navy is the exact tone used for the video wrap
     background too, so the two never look mismatched.
     Everything from "INTRO VIDEO" onward is unchanged.
  ================================================================ */
  :root{
    --stage-navy:#020d1e;
    --open-gold:#e8c378;
    --open-gold-soft:#f4dfae;
  }

  #opening-screen{
    position:fixed; inset:0; z-index:500;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:36px;
    padding:24px;
    background:var(--stage-navy);
    opacity:1;
    transition:opacity 1s ease;
  }
  #opening-screen.opening-hide{
    opacity:0;
    pointer-events:none;
  }
  /* a few soft stars, matching the reference art's night-sky feel */
  #opening-screen::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      radial-gradient(1.6px 1.6px at 14% 12%, rgba(255,255,255,.7), transparent),
      radial-gradient(1.3px 1.3px at 80% 8%,  rgba(255,255,255,.55), transparent),
      radial-gradient(1.8px 1.8px at 92% 22%, rgba(255,255,255,.6), transparent),
      radial-gradient(1.3px 1.3px at 8% 30%,  rgba(255,255,255,.45), transparent),
      radial-gradient(1.5px 1.5px at 65% 18%, rgba(255,255,255,.5), transparent),
      radial-gradient(1.3px 1.3px at 30% 45%, rgba(255,255,255,.4), transparent),
      radial-gradient(1.7px 1.7px at 88% 55%, rgba(255,255,255,.5), transparent),
      radial-gradient(1.3px 1.3px at 18% 62%, rgba(255,255,255,.4), transparent),
      radial-gradient(1.5px 1.5px at 50% 75%, rgba(255,255,255,.4), transparent),
      radial-gradient(1.3px 1.3px at 75% 85%, rgba(255,255,255,.4), transparent),
      radial-gradient(1.6px 1.6px at 10% 88%, rgba(255,255,255,.4), transparent),
      radial-gradient(1.3px 1.3px at 40% 95%, rgba(255,255,255,.35), transparent);
    pointer-events:none;
  }

  .opening-names-img{
    position:relative; z-index:1;
    width:min(480px, 78vw);
    height:auto;
    display:block;
    opacity:0;
    transform:translateY(12px);
    animation:openNamesFadeIn 1.6s ease .3s forwards;
  }
  @keyframes openNamesFadeIn{
    to{ opacity:1; transform:translateY(0); }
  }

  #tap-open-btn{
    position:relative; z-index:1;
    background:transparent;
    border:1px solid var(--open-gold);
    color:var(--open-gold-soft);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:.72rem;
    letter-spacing:.2em;
    text-transform:uppercase;
    padding:14px 44px;
    border-radius:999px;
    cursor:pointer;
    opacity:0;
    animation:openBtnFadeIn 1.2s ease 1.3s forwards, openBtnPulse 2.6s ease-in-out 3s infinite;
  }
  @keyframes openBtnFadeIn{ to{ opacity:1; } }
  @keyframes openBtnPulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(232,195,120,.35); }
    50%{ box-shadow:0 0 0 8px rgba(232,195,120,0); }
  }

  /* ---------- intro video ---------- */
  #intro-video-wrap{
    position:fixed; inset:0; z-index:200; background:var(--stage-navy);
    width:100vw; height:100vh; height:calc(var(--vh, 1vh) * 100); height:100dvh;
    display:flex; align-items:center; justify-content:center;
    transition:opacity 1.3s ease;
  }
  #intro-video-wrap.fade-out{ opacity:0; pointer-events:none; }
  #intro-video{
    width:100%; height:100%;
    object-fit:contain; object-position:center;
    display:block;
  }

  /* ---------- invitation scroll page ---------- */
  #invitation{
    position:relative; min-height:100vh; width:100%;
    background:
      radial-gradient(1.4px 1.4px at 12% 6%,  rgba(255,255,255,.5), transparent),
      radial-gradient(1.2px 1.2px at 82% 10%, rgba(255,255,255,.4), transparent),
      radial-gradient(1.6px 1.6px at 92% 28%, rgba(255,255,255,.45),transparent),
      radial-gradient(1.2px 1.2px at 6% 36%,  rgba(255,255,255,.3), transparent),
      radial-gradient(1.4px 1.4px at 70% 46%, rgba(255,255,255,.35),transparent),
      radial-gradient(1.2px 1.2px at 25% 58%, rgba(255,255,255,.3), transparent),
      radial-gradient(1.6px 1.6px at 88% 66%, rgba(255,255,255,.4), transparent),
      radial-gradient(1.2px 1.2px at 15% 76%, rgba(255,255,255,.3), transparent),
      radial-gradient(1.4px 1.4px at 55% 86%, rgba(255,255,255,.3), transparent),
      radial-gradient(1.2px 1.2px at 40% 95%, rgba(255,255,255,.3), transparent),
      linear-gradient(180deg, var(--royal) 0%, var(--navy-2) 18%, var(--navy) 40%, var(--navy) 100%);
    padding:36px 0 60px;
    display:flex; flex-direction:column; align-items:center;
  }
  .invite-card{
    width:100%; max-width:720px; padding:0 16px; margin-bottom:56px;
    opacity:0; transform:translateY(24px);
    transition:opacity .9s ease, transform .9s ease;
  }
  .invite-card:last-child{ margin-bottom:0; }
  .invite-card.in-view{ opacity:1; transform:translateY(0); }
  .invite-card img{
    width:100%; height:auto; display:block;
    box-shadow:0 10px 40px rgba(0,0,0,.45);
  }

  /* ---------- scroll-down hint ---------- */
  #scroll-hint{
    position:fixed; right:14px; top:50%; z-index:210;
    transform:translateY(-50%) translateX(0);
    display:flex; flex-direction:column; align-items:center; gap:4px;
    color:var(--gold-light); opacity:0; pointer-events:none;
    transition:opacity .5s ease;
    font-family:-apple-system,BlinkMacSystemFont,sans-serif; font-size:.7rem;
    text-shadow:0 1px 4px rgba(0,0,0,.6);
  }
  #scroll-hint.show{ opacity:1; }
  #scroll-hint svg{ width:20px; height:20px; animation:hintBounce 1.1s ease-in-out infinite; }
  @keyframes hintBounce{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(7px); }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
  }
</style>
</head>
<body>

<audio id="bgm" loop preload="auto" muted playsinline>
  <source src="https://mp3tourl.com/audio/1789298777935-bffe6a9c-7fb2-4971-bede-5be515da2879.mp3" type="audio/mpeg">
</audio>

<!-- ============ OPENING SCREEN (new) ============ -->
<div id="opening-screen">
  <img class="opening-names-img" src="assets/opening-names.png" alt="امۃ اللہ ⚓ ملا طٰہٰ">
  <button id="tap-open-btn" type="button">Tap to Open</button>
</div>

<!-- ============ INTRO VIDEO ============ -->
<div id="intro-video-wrap">
  <video id="intro-video" src="assets/intro.mp4" poster="assets/intro-poster.jpg" muted playsinline webkit-playsinline></video>
</div>

<!-- ============ INVITATION (single scroll) ============ -->
<div id="invitation">
  <div class="invite-card"><img src="assets/invitation-1.jpg" alt="دعوتِ نکاح"></div>
  <div class="invite-card"><img src="assets/invitation-2.jpg" alt="پروگرام"></div>
  <div class="invite-card"><img src="assets/invitation-3.jpg" alt="خاندان"></div>
</div>

<!-- small "scroll down" hint shown briefly once the invitation appears -->
<div id="scroll-hint">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
</div>

<script src="script.js"></script>

</body>
</html>
